# -------------------------------------------------------------------------
# nighthawk -- OSORIO geometry, Sharpen=0.30, Adaptive=false
# -------------------------------------------------------------------------
# Every other Sharpen>0 entry in this round leaves Adaptive=true, so the
# sharpen term only fires near text (see textMask() in the shader). This is
# the one variant that sharpens uniformly, everywhere, all the time --
# "always on", the way a nighthawk hunts by dusk and dawn regardless of
# light.
#
# [Effect-fringeshift]
# RedX=0.2000
# RedY=-0.3000
# GreenX=0.0500
# GreenY=0.2000
# BlueX=-0.3000
# BlueY=-0.3000
# Bicubic=true
# Adaptive=false
# Sharpen=0.30
# ShowMask=false
