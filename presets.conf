# Fringe Shift preset archive
# =========================================================================
# Reference values, kept out of the build. Nothing here is read by the
# effect: paste a block into ~/.config/kwinrc, or feed the values through
# kwriteconfig6, then `busctl --user call org.kde.KWin /KWin org.kde.KWin
# reconfigure`.
#
# Everything measured or guessed before OSORIO below has moved to
# presets.legacy.conf -- spe, spe-precise, mpe, mpe-bsplit, mpe-less/-more,
# reddit, gen3-consensus, ultracode-claude, and the 22-name MYTHOLOGY
# PRESETS round. Nothing there was wrong so much as superseded: OSORIO is
# read directly off a labelled reference diagram of this panel's actual
# subpixel layout (two sample points per emitter, so the tiling is visible,
# not just one cell) and confirmed by eye on live hardware with
# `fringe-tune`, which is a strictly better source than a scale drawing, a
# macro photograph, or an unsourced forum image. Copy a block out of the
# legacy file if you want one of the old readings back.
#
# CONVENTIONS
# -----------
# Every value below is a CONTENT shift in physical pixels: what the effect
# does to the image, not where the emitter sits. +X is right, +Y is DOWN.
# Content moves OPPOSITE to the emitter it compensates, so a green emitter
# sitting high on the pixel gets a positive (downward) GreenY.
#
# Shifts are clamped to +/-1 px by readConfig(). The shader re-centres the
# three shifts about zero before resampling, so only the RELATIVE geometry
# matters -- a preset that is already zero-mean passes through unchanged,
# and scaling every raw value by the same factor before centring gives the
# identical result as scaling the already-centred values (centring is
# linear), which is what lets the scale sweep below work directly off the
# raw OSORIO numbers.
#
# Negative values need `--` before them, or kwriteconfig6 parses the minus
# sign as an option:
#   kwriteconfig6 --file kwinrc --group Effect-fringeshift --key RedY -- -0.10


# =========================================================================
# OSORIO -- verified good, read directly off the reference subpixel diagram
# =========================================================================
# The diagram gives two sample points per channel (the tile repeats at
# roughly one pixel pitch, so the second point is the same emitter one cell
# over -- both readings agree to within drawing error):
#
#   red     (-0.20, 0.30)   (0.75, 1.20)
#   green   ( 0.05,-0.20)   (0.95, 0.80)
#   blue    ( 0.30, 0.30)   (1.20, 1.20)
#
# These are emitter positions in the diagram's own coordinates: origin at
# the pixel cell's top-left corner, pitch normalised to 1, +X right, +Y
# DOWN -- the same axis convention this file's content shifts already use,
# unlike the FreeType 26.6 tables referenced in the legacy file, which carry
# +Y up and need an axis flip on the way in. No flip needed here.
#
# RedY and BlueY follow the file's stated rule directly: red and blue sit
# low (y=+0.30, below the green row), so their content shift is negative
# (up), matching the -0.30 that made it into kwinrc. GreenY sits high
# (y=-0.20) and gets a positive (down) shift, +0.20 -- same rule, same
# sign. RedX and BlueX likewise negate the emitter's left/right offset
# (-0.20 -> +0.20, +0.30 -> -0.30).
#
# GreenX is the one value NOT taken as a plain negation of 0.05 -- live
# on-hardware tuning with fringe-tune converged on +0.05, not -0.05. Green's
# horizontal offset is small enough (a twentieth of a pixel) that it sits
# near the noise floor of a by-eye read, and the diagram's stated point for
# green is close enough to the R/B horizontal midpoint that either sign is
# a small perturbation -- but the eye, not the diagram, gets the last word
# for a value this close to the resample's own precision. Confirmed by
# fringe-tune's on-screen readout, kept starred as changed-from-launch
# through a full tuning session:
#
#   Red     X   0.2000 *  Y  -0.3000 *
#   Green   X   0.0500     Y   0.2000 *
#   Blue    X  -0.3000 *  Y  -0.3000 *
#
# Cross-check: after the shader's own centring step (subtract the mean of
# the three, per axis -- mean X = -0.01667, mean Y = -0.13333), OSORIO's
# effective values are (0.2167, -0.1667, 0.0667, 0.3333, -0.2833, -0.1667).
# That lands within 0.02 px on every one of six numbers of
# gen3-layout-spe-precise in presets.legacy.conf (0.2000, -0.1567, 0.0450,
# 0.3133, -0.2450, -0.1567) -- an independent scale-drawing read from
# months earlier landing this close to a fresh diagram plus a by-eye tune
# is the kind of agreement gen3-consensus was built on, not a coincidence
# worth ignoring.
#
# [Effect-fringeshift]
RedX=0.2000
RedY=-0.3000
GreenX=0.0500
GreenY=0.2000
BlueX=-0.3000
BlueY=-0.3000
Bicubic=true
Adaptive=true
Sharpen=0.0
ShowMask=false


# =========================================================================
# KEEN-EYED ANIMALS -- 20 synthetic variants derived from OSORIO, archived
# =========================================================================
# Same idea as the old MYTHOLOGY PRESETS round in presets.legacy.conf --
# named candidates meant to be browsed and eliminated with `fringe-presets`
# -- but built off OSORIO instead of gen3-consensus, and named for animals
# known for unusual or exceptional eyesight rather than mythological eyes,
# so the two rounds don't collide on names. None of these are new
# measurements; they're synthetic probes of OSORIO's parameter space (scale,
# axis-only, resample, sharpen, blends with the strongest legacy reading,
# rotation, mirroring) picked to cover the space for a by-eye pass. NONE of
# these are registered in `fringe-presets` yet -- only OSORIO itself was, on
# the same basis the old round's five survivors were: copy a block from here
# into fringe-presets' DATA array to bring a candidate into the picker.
#
# Every scale variant below is the raw OSORIO sextuple multiplied by a
# constant, per the CONVENTIONS note above -- multiplying before or after
# the shader's centring step gives the same result.


