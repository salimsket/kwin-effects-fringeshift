# -------------------------------------------------------------------------
# cat -- OSORIO with GreenX and GreenY zeroed
# -------------------------------------------------------------------------
# Green pinned at the R/B midpoint on both axes -- cats have poor
# discrimination in the red/green range, so a preset that drops green's own
# offset entirely fits the name. Tests how much of the correction is
# actually riding on green's contribution.
#
# [Effect-fringeshift]
# RedX=0.2000
# RedY=-0.3000
# GreenX=0.0
# GreenY=0.0
# BlueX=-0.3000
# BlueY=-0.3000
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# dragonfly -- OSORIO rotated 90 degrees, (x,y) -> (-y,x)
# -------------------------------------------------------------------------
# A compound-eyed animal for a rotation test: simulates the correction a
# panel mounted in portrait would need, by rotating each channel's shift
# vector 90 degrees clockwise rather than re-deriving the geometry.
#
#   red   (0.2000,-0.3000) -> (0.3000, 0.2000)
#   green (0.0500, 0.2000) -> (-0.2000, 0.0500)
#   blue  (-0.3000,-0.3000) -> (0.3000,-0.3000)
#
# [Effect-fringeshift]
# RedX=0.3000
# RedY=0.2000
# GreenX=-0.2000
# GreenY=0.0500
# BlueX=0.3000
# BlueY=-0.3000
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


