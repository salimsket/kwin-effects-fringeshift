# Fringe Shift preset archive
# =========================================================================
# Reference values, kept out of the build. Nothing here is read by the
# effect: paste a block into ~/.config/kwinrc, or feed the values through
# kwriteconfig6, then `busctl --user call org.kde.KWin /KWin org.kde.KWin
# reconfigure`.
#
# CONVENTIONS
# -----------
# Every value below is a CONTENT shift in physical pixels: what the effect
# does to the image, not where the emitter sits. +X is right, +Y is DOWN.
# Content moves OPPOSITE to the emitter it compensates, so a green emitter
# sitting high on the pixel gets a positive (downward) GreenY.
#
# Shifts are clamped to +/-1 px by readConfig(). The shader re-centres the
# three shifts about zero before resampling, so only the RELATIVE geometry
# matters -- a preset that is already zero-mean passes through unchanged.
#
# Negative values need `--` before them, or kwriteconfig6 parses the minus
# sign as an option:
#   kwriteconfig6 --file kwinrc --group Effect-fringeshift --key RedY -- -0.10
#
# CONVERTING AN EMITTER TABLE (26.6 fixed point)
# ----------------------------------------------
# Rasteriser subpixel tables are usually FreeType 26.6: one unit = 1/64 px.
# The striped-RGB baseline is the giveaway -- +/-21/64 = +/-0.328 px is
# exactly R-left / G-centre / B-right on an RGB stripe. Such tables carry
# emitter POSITIONS with +y UP, so:
#
#   X = -sub.x / 64        (both conventions have +X right; shift opposes)
#   Y = +sub.y / 64        (the up->down axis flip already opposes)


# -------------------------------------------------------------------------
# shipped-defaults -- what the .kcfg carries, so what you get untouched
# -------------------------------------------------------------------------
# Two separations, 0.450 px vertical and 0.476 px horizontal. Slightly wider
# than either measured read below: gen3-layout-mpe has 0.437 / 0.449, the
# single-cell drawing 0.472 / 0.441. Nothing here derives it from a
# measurement -- it is the set the effect ships with.
#
# The vertical pair is written UNCENTRED, green +0.300 against red and blue
# -0.150, which is the emitter geometry read literally: one upper emitter
# against two lower ones. The shader subtracts the midpoint of the three
# before resampling, so what reaches the resample is +/-0.225 and no channel
# carries a fraction bigger than that. Writing it centred as +/-0.225 is
# bit-identical -- see the translation-invariant check.
#
# [Effect-fringeshift]
# RedX=0.238
# RedY=-0.150
# GreenX=0.0
# GreenY=0.300
# BlueX=-0.238
# BlueY=-0.150
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# rgb-stripe -- conventional LCD, no vertical structure
# -------------------------------------------------------------------------
# Emitters R(-21,0) G(0,0) B(+21,0) in 26.6 = R(-0.328,0) G(0,0) B(+0.328,0).
# Included mostly because it validates the 1/64 px unit: a third of a pixel
# either side of centre is the definition of an RGB stripe.
#
# [Effect-fringeshift]
# RedX=0.328125
# RedY=0.0
# GreenX=0.0
# GreenY=0.0
# BlueX=-0.328125
# BlueY=0.0


# -------------------------------------------------------------------------
# qd-oled-triad -- conservative, and an early default
# -------------------------------------------------------------------------
# Green down 0.10, red and blue up 0.05: one upper emitter against two lower
# ones, and roughly 0.30x the full triad geometry. Vertical only. This is the
# floor of the useful range -- visible on a fringe test pattern, essentially
# invisible in normal use, which is the intent.
#
# [Effect-fringeshift]
# RedX=0.0
# RedY=-0.05
# GreenX=0.0
# GreenY=0.10
# BlueX=0.0
# BlueY=-0.05


# -------------------------------------------------------------------------
# qd-oled-triad-x1.5 -- qd-oled-triad, 50% stronger
# -------------------------------------------------------------------------
# [Effect-fringeshift]
# RedX=0.0
# RedY=-0.075
# GreenX=0.0
# GreenY=0.15
# BlueX=0.0
# BlueY=-0.075


# -------------------------------------------------------------------------
# emitter-geometry-full -- converted from a measured 26.6 table
# -------------------------------------------------------------------------
# Source table, replacing a striped-RGB default:
#
#     sub[0].x = -18;  sub[0].y = -11;      /* R */
#     sub[1].x =   2;  sub[1].y =  22;      /* G */
#     sub[2].x =  16;  sub[2].y = -11;      /* B */
#
# In pixels (emitter positions, +y up):
#     R(-0.28125, -0.171875)   down and left
#     G(+0.03125, +0.34375)    up, top vertex
#     B(+0.25,    -0.171875)   down and right
#
# Green high, red and blue low: the QD-OLED triangle, and the sign of y is
# fixed by that geometry alone. The table is zero-mean in both axes, so the
# shader's centring step is a no-op on it.
#
# This is the FULL geometric correction -- 3.4x the shipped GreenY -- and the
# first preset here with a horizontal component. Worth knowing: the README
# records a measured 16% chromatic mismatch at G +0.30 / RB -0.15, which is
# nearly this configuration. Centring is what cancels that, and centring has
# nothing left to do when the input arrives already centred.
#
# [Effect-fringeshift]
# RedX=0.28125
# RedY=-0.171875
# GreenX=-0.03125
# GreenY=0.34375
# BlueX=-0.25
# BlueY=-0.171875


# -------------------------------------------------------------------------
# qd-oled-gen3 -- derived for 31.5" 4K QD-OLED (140 PPI)
# -------------------------------------------------------------------------
# ESTIMATE, not a measurement. Derived, with the reasoning stated so it can
# be argued with. Measured against a fringe pattern it should be adjusted.
#
# Target panel: 3840x2160 over 699x395 mm = 140 PPI, the 3rd-gen 32" 4K
# QD-OLED class.
#
# 1. TOPOLOGY IS UNCHANGED. Green at the top vertex, red and blue at the
#    bottom corners, is the QD-OLED signature and holds across generations.
#    Gen 3's headline change is density and brightness, not a new triad.
#
# 2. GEOMETRY IN PIXEL UNITS IS ALSO UNCHANGED. The emitter offsets are a
#    fixed fraction of the pixel pitch, and the pitch is what shrinks with
#    density -- so a higher-PPI panel does not want different numbers here on
#    geometric grounds. What changes is PERCEPTUAL: at 140 PPI each pixel
#    subtends ~0.79x the angle of a 110 PPI Gen 1 panel at the same distance,
#    so the same residual fringe is correspondingly less visible.
#
# 3. SO: SCALE TO 0.6 OF FULL GEOMETRY. Full correction buys a fringe
#    reduction the eye can no longer fully resolve at this density, while the
#    resample's cost is paid in full. That cost is quadratic in the shift --
#    the shader's compensation term is min(0.8625 * |f|^2, 0.35) -- so 0.6x
#    the shift is 0.36x the Laplacian correction: 0.037 here against 0.103
#    for the full table. Neither reaches the 0.35 clamp, but the smaller term
#    means proportionally less clipped overshoot on hard edges.
#
# 4. SYMMETRISE. The measured table is skewed: green sits 0.031 px right of
#    centre, and red/blue are -0.281/+0.25 rather than a matched pair. That
#    is a ~0.03 px asymmetry, below what a resample meaningfully delivers and
#    more likely measurement noise than real geometry. An ideal triangle --
#    G(0, +1/3), R(-1/4, -1/6), B(+1/4, -1/6) scaled by 0.6 -- is the cleaner
#    prior, and it stays exactly zero-mean.
#
# Emitters, +y up: G(0, +0.20)  R(-0.15, -0.10)  B(+0.15, -0.10)
#
# [Effect-fringeshift]
# RedX=0.15
# RedY=-0.10
# GreenX=0.0
# GreenY=0.20
# BlueX=-0.15
# BlueY=-0.10
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false

# -------------------------------------------------------------------------
# baseline -- the good default generated from pixel layout image
# -------------------------------------------------------------------------
RedX=0.221
RedY=-0.236
GreenX=0.069
GreenY=0.236
BlueX=-0.221
BlueY=-0.236
Bicubic=true
Adaptive=true
Sharpen=0.0
ShowMask=false

# Resolve original
# [Effect-fringeshift]
# RedX=-0.040
# RedY=-0.159
# GreenX=-0.054
# GreenY=0.484
# BlueX=-0.205
# BlueY=0.446
# Bicubic=true
# Adaptive=true
# Sharpen=0.03
# ShowMask=false

# -------------------------------------------------------------------------
# gen3-layout-spe -- single-pixel extraction, from the drawn subpixel map
# -------------------------------------------------------------------------
# The first of three readings of the same panel. SPE measures ONE idealised
# cell, so it resolves the emitter shapes cleanly but has no averaging: every
# edge is read once, and a 2 px slip in reading an edge is a 0.015 px error in
# the result with nothing to cancel it. Compare against gen3-layout-mpe, which
# has the opposite failure mode.
#
# Derived by measuring emitter rectangles off a scale drawing of the triad,
# not from a rasteriser table. Extents as fractions of the pixel cell:
#
#     green   x 0.13 .. 0.88   y 0.08 .. 0.38   -> centroid (0.504, 0.227)
#     red     x 0.13 .. 0.57   y 0.48 .. 0.92   -> centroid (0.352, 0.699)
#     blue    x 0.66 .. 0.93   y 0.48 .. 0.92   -> centroid (0.793, 0.699)
#
# Two separations matter, and only these two:
#
#   R <-> B horizontally   0.793 - 0.352 = 0.441 px  ->  +/-0.221
#   G <-> R/B vertically   0.699 - 0.227 = 0.472 px  ->  +/-0.236
#
# The vertical one IS the green/magenta fringe. Green alone occupies the top
# of the cell, so the topmost emitting row of a white block puts out green
# with no red or blue beneath it; the bottom row puts out red+blue with no
# green above. Green edge on top, magenta edge on bottom. The horizontal
# separation is the orthogonal artefact -- red on left edges, blue on right.
#
# Green sits 0.069 px right of the R/B midpoint. That asymmetry is at the
# edge of what a resample delivers; carried here because the drawing shows it
# but it can be zeroed without changing the fringe result.
#
# Zero-mean in both axes already, so the shader's centring step is a no-op.
#
# [Effect-fringeshift]
# RedX=0.221
# RedY=-0.236
# GreenX=0.069
# GreenY=0.236
# BlueX=-0.221
# BlueY=-0.236
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# gen3-layout-spe-precise -- spe, re-centred by exact 3-way centroid mean
# -------------------------------------------------------------------------
# gen3-layout-spe above rounds its centroids (0.504/0.227, 0.352/0.699,
# 0.793/0.699) before taking separations, and then splits each axis
# differently: Y is written as a raw +/-0.236 pair and relies on the
# shader's mean-centring step to land at the true 2:1 green/red-blue split
# (see the bookkeeping note in osorio-sdf); X is written as a plain
# separation/2 for red/blue plus a bolted-on GreenX, which is the right
# answer only because red and blue happen to be symmetric about a point
# green does not sit on. Both routes get close, but neither is the same
# calculation actually being asked: where do these three centroids sit
# relative to their own three-way mean, per axis.
#
# Redone directly from the drawing's stated extents, exact midpoints, no
# intermediate rounding:
#
#   green   x (0.13+0.88)/2 = 0.505   y (0.08+0.38)/2 = 0.230
#   red     x (0.13+0.57)/2 = 0.350   y (0.48+0.92)/2 = 0.700
#   blue    x (0.66+0.93)/2 = 0.795   y (0.48+0.92)/2 = 0.700
#
#   mean x = (0.505 + 0.350 + 0.795) / 3 = 0.550000
#   mean y = (0.230 + 0.700 + 0.700) / 3 = 0.543333...
#
# Emitter offset from that mean (positive = right / down, this dataset's
# convention -- see gen3-layout-spe above):
#
#   green  ( -0.045000, -0.313333 )
#   red    ( -0.200000, +0.156667 )
#   blue   ( +0.245000, +0.156667 )
#
# Content shift is the offset negated (an emitter sitting high/left gets a
# positive, i.e. opposite, correction -- the rule stated at the top of this
# file):
#
#   RedX   =  0.2000     RedY   = -0.1567
#   GreenX =  0.0450     GreenY =  0.3133
#   BlueX  = -0.2450     BlueY  = -0.1567
#
# Zero-mean by construction on both axes -- it's the offset from the mean,
# so the shader's own centring step (which does the identical arithmetic at
# render time) is a true no-op here, not an approximation of one. The Y
# values land within 0.0004 px of gen3-layout-spe's *effective*
# (post-centring) numbers -- 0.3133 against 0.3147, -0.1567 against
# -0.1573 -- so this is a precision correction, not a different geometry
# reading. X moves more: GreenX from an implied +0.069 to +0.045, because
# the original split gave green none of the shared mean and put all of the
# adjustment on red/blue.
#
# [Effect-fringeshift]
# RedX=0.2000
# RedY=-0.1567
# GreenX=0.0450
# GreenY=0.3133
# BlueX=-0.2450
# BlueY=-0.1567
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false



# -------------------------------------------------------------------------
# gen3-layout-mpe -- multi-pixel extraction, from an RTINGS macro photograph
# -------------------------------------------------------------------------
# The same panel read a second, independent way. MPE measures the repeating
# LATTICE across roughly sixty cells rather than the shape of one, which
# inverts SPE's failure mode: individual emitter edges are blurred by the
# camera's optics and unreadable, but a centre-to-centre spacing averaged over
# a dozen rows converges, and a per-row slip of a pixel or two cancels instead
# of accumulating.
#
# It also brings a check SPE structurally cannot have. The pixel pitch must be
# the SAME in both axes -- display pixels are square -- so measuring the
# horizontal and vertical periods separately and finding they agree confirms
# the lattice was counted correctly. They came out 78.4 and ~78 px. Any real
# disagreement there would have meant a miscounted row or column, and every
# offset derived from it would have been wrong by that ratio.
#
# MEASUREMENTS (image ~847x477, pitch ~78 px)
#
#   green row centres    y = 8, 88, 165, 243, 322, 400   spacing 78.4
#   R/B row centres      y = 42, 122, 200, 278, 356, 434 spacing 78.4
#   G -> R/B offset          34, 34,  35,  35,  34,  34  mean   34.3
#
#   G <-> R/B vertically   34.3 / 78.4 = 0.437 px  ->  +/-0.219
#   R <-> B horizontally   red centre ~21, blue ~56 in a 78 px period
#                          = 0.449 px  ->  +/-0.225
#
# WHERE IT DISAGREES WITH SPE, AND BY HOW MUCH
#
# Horizontal is a match: 0.449 against SPE's 0.441, well inside either
# method's error. Vertical is not: 0.437 against 0.472, a 7% gap. MPE is the
# more trustworthy of the two on that axis -- it is the one with averaging,
# and vertical row spacing is the single best-determined quantity in the
# photograph -- but 7% is close enough to the reading error that this is a
# lean, not a verdict.
#
# Worth recording: the A/B ladder independently drifted to GreenY 0.217 before
# it stalled, and this measurement lands at 0.219. Two unrelated routes to the
# same number is the strongest evidence in this file for anything.
#
# GreenX is ZERO here, not merely small. The green bar sits centred over the
# R/B pair to within reading error, whereas SPE put it 0.069 px right. The two
# readings do not agree in magnitude and barely agree in sign, which is itself
# the finding: that skew is below what either method resolves, and below what
# the resample delivers.
#
# [Effect-fringeshift]
# RedX=0.225
# RedY=-0.219
# GreenX=0.0
# GreenY=0.219
# BlueX=-0.225
# BlueY=-0.219
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# gen3-layout-mpe-bsplit -- mpe with the R/B row split vertically
# -------------------------------------------------------------------------
# Answers one specific observed residual on mpe: a YELLOW band and a BLUE band
# stacked at the BOTTOM edge of light-on-dark content. That pairing is
# diagnostic and is not a magnitude error, so the -less / -more ladder cannot
# fix it -- both scale all three channels together and would only make the two
# bands narrower or wider without merging them.
#
# WHY THE LADDER CANNOT REACH IT. Yellow is R+G with blue missing; blue is
# blue with R+G missing. Two adjacent bands of exactly complementary hue on one
# edge means the blue channel's bottom edge does not land where red's and
# green's do. But mpe pins RedY and BlueY to the SAME value (-0.219) on the
# premise that red and blue share one emitter row. A scale factor preserves
# RedY == BlueY, so it preserves the split. Only breaking that equality closes
# it, and every scaled preset in this file leaves it intact by construction.
#
# WHICH WAY TO BREAK IT, READ OFF THE ORDER OF THE TWO BANDS
#
#   blue band BELOW yellow   blue is landing low -> lift it -> BlueY -0.252
#   yellow band BELOW blue   blue is landing high -> drop it -> BlueY -0.186
#
# The values below assume the first, which is the case where blue is still
# under-corrected relative to red. If the bands read the other way round,
# substitute -0.186 and nothing else changes. Check the order on a hard white
# rectangle, not on text -- the adaptive mask and the stroke's own width both
# muddy which band is outermost at glyph scale.
#
# STEP SIZE is 15% of GreenY, the file's established discrimination threshold
# (see the -less / -more note). Applied to ONE channel on ONE axis rather than
# to all three, so it is a smaller perturbation of the triad than -more is.
#
# NOT ZERO-MEAN in y: -0.252, 0.219, -0.219 sums to -0.084. This is the first
# preset here that relies on the shader's centring step rather than being a
# no-op for it -- centring subtracts the mean and leaves the relative channel
# geometry, which is the whole content of this preset, bit-identical.
#
# WHAT IT DOES NOT CLAIM. No measurement in this file supports red and blue
# sitting on different rows; both readings put them side by side on one. So
# this is a correction fitted to an observation, not a layout finding. If it
# works, the honest reading is that something downstream of geometry is
# displacing blue -- panel-side subpixel rendering, or the eye's own chromatic
# aberration, which is largest exactly at the blue end.
#
# [Effect-fringeshift]
# RedX=0.225
# RedY=-0.219
# GreenX=0.0
# GreenY=0.219
# BlueX=-0.225
# BlueY=-0.252
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# gen3-layout-mpe-less / -more -- mpe scaled +/-15%
# -------------------------------------------------------------------------
# A uniform scale of both axes, so the triad keeps its shape and only its
# magnitude moves. Both stay exactly zero-mean, so the shader's centring step
# is a no-op on them and the relative geometry is untouched.
#
#   gen3-layout-mpe-less   x0.85   GreenY 0.186
#   gen3-layout-mpe        x1.00   GreenY 0.219
#   gen3-layout-mpe-more   x1.15   GreenY 0.252
#
# WHY 15% AND NOT 8%. The earlier ab ladder stepped +/-8% and came back
# inconclusive. That is a result, not a failed experiment: it says 8% at this
# magnitude sits below the discrimination threshold, so a smaller step would
# waste another session. 15% is the smallest step with a real chance of being
# visible while still being a nudge rather than a different setting.
#
# WHAT EACH OUTCOME WOULD MEAN, WHICH IS THE REASON TO RUN IT
#
#   -less wins    0.186 is below all three readings (spe 0.236, mpe 0.219,
#                 reddit 0.235 +/-0.05). Geometry does not explain a win here,
#                 so something else would: most likely that the resample's own
#                 softening is doing part of the fringe-hiding, and less shift
#                 means less of it. Suspect the answer rather than adopt it --
#                 check a hard edge for a MAGENTA top fringe, which is the
#                 signature of over-correction and cannot be confused for a
#                 quality preference.
#
#   -more wins    0.252 is above all three. The honest reading is not that the
#                 measurements were wrong but that the TARGET is: they measure
#                 the area centroid of an emitter, whereas the eye localises
#                 the centroid of emitted luminance, and green's wide short bar
#                 need not put those in the same place. Shift-gain pushes the
#                 same way -- 0.680 of nominal arrives at f = 0.25, so a
#                 nominal 0.252 delivers about 0.171 on a text stroke.
#
#   neither       the most likely outcome given the 8% result, and it settles
#                 the question: the geometry is right, the remaining fringe is
#                 not a magnitude error, and Sharpen is the next knob rather
#                 than another shift. Stop here.
#
# Laplacian, now that compensation is per axis (min(ca * f^2, 0.35), ca =
# 0.8625): less kx 0.032 / ky 0.030, mpe 0.044 / 0.041, more 0.058 / 0.055.
# All far from the 0.35 clamp, so none of the three is trading edge overshoot
# for shift -- the comparison really is magnitude alone.


# -------------------------------------------------------------------------
# gen3-layout-mpe-less -- mpe x0.85
# -------------------------------------------------------------------------
# [Effect-fringeshift]
# RedX=0.191
# RedY=-0.186
# GreenX=0.0
# GreenY=0.186
# BlueX=-0.191
# BlueY=-0.186
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# gen3-layout-mpe-more -- mpe x1.15
# -------------------------------------------------------------------------
# [Effect-fringeshift]
# RedX=0.259
# RedY=-0.252
# GreenX=0.0
# GreenY=0.252
# BlueX=-0.259
# BlueY=-0.252
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# gen3-layout-reddit -- third reading, from an unsourced forum macro
# -------------------------------------------------------------------------
# KEPT FOR THE RECORD, NOT FOR USE, AND DELIBERATELY NOT AVERAGED IN WITH
# spe OR mpe. It agrees with both, and that is the whole of what it
# contributes: its uncertainty is wider than the gap it would be helping to
# settle, so averaging it in would widen the answer, not sharpen it. A
# measurement that cannot discriminate is not evidence, however much it looks
# like a second opinion.
#
# WHAT IT CONFIRMS
#   Topology. Green bar on top, red and blue side by side beneath. That was
#   never in question, but it does rule out the photo being a WOLED or an
#   RGB stripe, which would have made everything below meaningless.
#
# WHAT IT MEASURES, WITH HONEST BARS
#   pitch ~68-70 px, roughly square in both axes
#   G <-> R/B vertically   0.47 +/- 0.05   ->  +/-0.235
#   R <-> B horizontally   0.45 +/- 0.08   ->  +/-0.225
#   GreenX                 unresolvable    ->  0
#
#   Those bars are the point. SPE and MPE disagree vertically by 0.035, and
#   this reading cannot resolve better than 0.05. It lands between them and
#   would land between them whichever were right.
#
# WHY THE BARS ARE THAT WIDE
#
# 1. THE RED IS CLIPPED. Large red areas have blown out and merged into
#    continuous bands. A saturated emitter's apparent extent grows with
#    exposure, so its edges are an exposure reading, not a geometry one, and
#    where neighbours have merged there is no centre left to find. This is
#    the dominant term and it is not recoverable by being careful.
#
# 2. THE FIELD IS NOT WHITE. The heavy magenta cast means the three channels
#    were not driven equally, whether by the content on screen or the
#    camera's white balance. Blue reads tiny and red enormous, which cannot
#    both be emitter area. Relative sizes are therefore unusable here --
#    only centres, and only where nothing has merged.
#
# 3. UNKNOWN PROVENANCE. A forum macro has no stated panel. The topology is
#    QD-OLED but the generation is not knowable from the image, and Gen 1/2/3
#    are exactly what one would be trying to tell apart. Folding an unknown
#    panel into a Gen 3 table risks mixing two different panels into one
#    number, which is a worse failure than a wide error bar because it does
#    not announce itself.
#
# WHAT IS NOT ACTUALLY A PROBLEM
#   The rotation. It looks like the worst defect and is nearly the least:
#   the vertical component of a lattice vector rotated by theta scales as
#   cos(theta), so a 3-degree tilt costs 0.14% -- far under everything above.
#   Measured within one cell rather than across the frame, tilt is close to
#   free. It would even be an ASSET to a proper lattice fit, since a rotated
#   grid samples sub-pixel phase at many offsets rather than one. That needs
#   the image data and a fitting pass, not an eye, and the clipping in (1)
#   would still cap what came out.
#
# [Effect-fringeshift]
# RedX=0.225
# RedY=-0.235
# GreenX=0.0
# GreenY=0.235
# BlueX=-0.225
# BlueY=-0.235
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# osorio-sdf -- fourth reading, from a renderer tuned by eye on live hardware
# -------------------------------------------------------------------------
# Source: Ruben Osorio Lopez, "Rendering Crispy Text On The GPU", 2025-06-12,
# https://osor.io/text
#
# (Name note: the article moves AWAY from SDFs -- they were the previous
# solution it replaces. It rasterises quadratic beziers directly at runtime
# into a persistent atlas. The preset name is kept as asked.)
#
# The first reading in this file that is not a measurement of a picture. The
# author built a QD-OLED-aware text renderer, exposed the subpixel layout as an
# editor, and moved the three sample rectangles by hand until the fringing on
# his own panel went away. The published screenshot of that editor carries the
# converged rectangles with their corners labelled. So the numbers below are a
# reading of where a working renderer's fringe correction actually settled,
# which is a different kind of evidence from spe/mpe/reddit -- those measure
# emitter geometry and infer the correction, this observes the correction.
#
# WHAT THE ARTICLE DOES, AND WHY ITS NUMBERS ARE COMMENSURABLE WITH OURS
#
# Per glyph texel it shoots three rays, not one, at three separate sample
# AREAS -- lerped between per-channel r_min/r_max, g_min/g_max, b_min/b_max --
# accumulating coverage per channel over up to 512 quasirandom (R_2 sequence)
# offsets. Each channel's value is therefore the glyph convolved with a box
# filter the shape of that channel's rect, evaluated at the rect's CENTRE.
# The box centre is our shift. Everything else in the pipeline -- the atlas,
# the temporal accumulation, the band bitsets -- is orthogonal to geometry.
#
# He also reports the artefact this file was built around, on a QD-OLED driven
# as if it were an RGB stripe: "very visible green fringing on top and magenta
# at the bottom." Same sign, same axis, arrived at independently.
#
# THE EDITOR SCREENSHOT (rect corners in pixel-cell units, +y DOWN -- fixed by
# green's rect sitting above the other two, which is the QD-OLED signature)
#
#   green   x  0.05 .. 0.95   y -0.20 .. 0.80   -> centroid (0.500, 0.300)
#   red     x -0.20 .. 0.75   y  0.30 .. 1.20   -> centroid (0.275, 0.750)
#   blue    x  0.30 .. 1.20   y  0.30 .. 1.20   -> centroid (0.750, 0.750)
#
#   G <-> R/B vertically   0.750 - 0.300 = 0.450 px
#   R <-> B horizontally   0.750 - 0.275 = 0.475 px
#   GreenX                 0.500 - 0.5125 = -0.013 px, i.e. nothing
#
# HOW IT COMPARES
#
#                       vertical      horizontal    GreenX
#   spe                 0.472         0.441         +0.069
#   mpe                 0.437         0.449          0
#   reddit              0.47 +/-0.05  0.45 +/-0.08   unresolvable
#   osorio (this)       0.450         0.475         -0.013
#
# Vertical lands between spe and mpe, 3% above mpe -- under the 8% the ab
# ladder already established as below the discrimination threshold, so this is
# a confirmation, not a correction. Horizontal is 6% above both photo readings,
# also inside it. GreenX is a third independent vote for zero, and the second
# to disagree with spe's +0.069 in sign as well as magnitude.
#
# Three routes -- one scale drawing, one macro photograph, one renderer tuned
# by eye on hardware -- now agree to within the noise floor on both axes. The
# geometry question is closed.
#
# IT ALSO RULES OUT -more. gen3-layout-mpe-more's premise was that the eye
# tracks a luminance centroid the area centroid misses, so the true target sits
# above every measurement. This preset is a direct test of that: it IS a
# perceptual target, converged by a person looking at a screen, and it lands at
# 0.450 against -more's effective 0.504. If the luminance centroid diverged
# from the area centroid, this is where it would have shown, and it did not.
#
# WHAT THE ENLARGEMENT DOES AND DOES NOT DO -- AND WHY SHARPEN STAYS AT 0
#
# The article's most surprising finding is that these rects must be ENLARGED
# well past the physical emitters, overlapping each other and spilling outside
# the pixel cell, before the output looks right: light diffuses, so the
# effective emitter is bigger than the drawn one. He notes this is equivalent
# to Evan Wallace's post-render horizontal blur.
#
# The dilation is enormous and NOT symmetric. Against spe's drawn emitters,
# green goes from 0.75 x 0.30 of a cell to 0.90 x 1.00 -- 3.3x taller -- and
# grows more downward (+0.42) than upward (+0.28). Every centroid moves:
#
#   green  (0.505, 0.230) -> (0.500, 0.300)     down 0.070
#   red    (0.352, 0.699) -> (0.275, 0.750)     down 0.051, left 0.077
#   blue   (0.793, 0.699) -> (0.750, 0.750)     down 0.051, left 0.043
#
# But almost entirely in COMMON MODE, which the shader's centring step removes
# exactly. What survives is 0.02 px of relative vertical change -- the whole
# difference between spe's 0.472 and this 0.450. A 3.3x dilation buys a 4%
# change in the correction.
#
# That is the argument for Sharpen. gen3-layout-mpe-less/-more ended "Sharpen
# is the next knob rather than another shift"; this says it is the wrong knob.
# Diffusion contributes essentially no displacement and a great deal of
# low-pass, and the article's result is that MORE of that low-pass is what made
# the output correct. Sharpening is not recovering detail there, it is fighting
# the term that fixed it. Sharpen is 0.0 below for a reason now, not by default.
#
# BOOKKEEPING -- READ THIS BEFORE COMPARING THE NUMBERS TO gen3-layout-mpe
#
# Three channels with red and blue coincident split a vertical separation 2:1,
# not 1:1 -- green carries 2/3 of it and red/blue 1/3 each. So a 0.450
# separation is GreenY +0.300, RedY = BlueY -0.150, which is what appears
# below and is exactly zero-mean.
#
# The gen3-layout-* family instead writes +s / -s / -s, which sums to -s and is
# NOT zero-mean in y despite what those blocks say. It renders correctly --
# centring turns +0.219/-0.219/-0.219 into +0.292/-0.146/-0.146, separation
# 0.438, the measured value -- but the literal numbers there are not emitter
# offsets and must be centred before being compared with these. mpe's effective
# GreenY is 0.292, not 0.219; -more's is 0.336. X is unaffected: red and blue
# are already symmetric about a zero green.
#
# X here is symmetrised on the same grounds as qd-oled-gen3 section 4 -- the
# raw rects put red at -0.233 and blue at +0.242 about the mean, an 0.008 px
# skew far below what either the reading or the resample delivers.
#
# Zero-mean in both axes, so centring is genuinely a no-op on this one.
# Laplacian per axis, min(0.8625 * f^2, 0.35): green ky 0.078, R/B kx 0.049,
# R/B ky 0.019. The largest is still well under the 0.35 clamp.
#
# [Effect-fringeshift]
# RedX=0.238
# RedY=-0.150
# GreenX=0.0
# GreenY=0.300
# BlueX=-0.238
# BlueY=-0.150
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# gen3-consensus -- mean of spe, mpe and osorio-sdf; reddit excluded
# -------------------------------------------------------------------------
# osorio-sdf's own comparison table (reproduced below) is the premise for
# this preset: three independently-arrived-at readings of the same panel --
# a scale drawing (spe), a macro photograph averaged over ~60 cells (mpe),
# and a renderer tuned by eye on live hardware (osorio) -- land within the
# discrimination threshold the ab ladder already established (8%) of each
# other on both axes. reddit is the fourth reading in this file and is
# EXCLUDED on purpose: its own section says plainly it should not be
# averaged in, because its error bars are wider than the gap between spe and
# mpe, so folding it in would widen the answer rather than sharpen it.
#
#                       vertical      horizontal    GreenX
#   spe                 0.472         0.441         +0.069
#   mpe                 0.437         0.449          0
#   osorio              0.450         0.475         -0.013
#
# (mpe's 0.437 and 0.449 are the measured lattice separations, not the raw
# kwinrc numbers in gen3-layout-mpe above -- those are written +s/-s/-s and
# only reach this separation after the shader's centring step, per the
# bookkeeping note in osorio-sdf above.)
#
# MEAN OF THE THREE
#
#   vertical    (0.472 + 0.437 + 0.450) / 3 = 0.453
#   horizontal  (0.441 + 0.449 + 0.475) / 3 = 0.455
#   GreenX      (0.069 + 0.000 - 0.013) / 3 = 0.019
#
# SPLIT INTO PER-CHANNEL, PRE-CENTRED
#
# Vertical: red and blue read the same row on all three sources, so the
# three-way channel mean puts green at 2/3 of the separation and red/blue at
# 1/3 each in the opposite direction -- the same 2:1 split osorio-sdf derives
# for itself, applied here to the averaged separation instead of one source's:
#
#   GreenY =  (2/3) * 0.453 =  0.302
#   RedY   = -(1/3) * 0.453 = -0.151
#   BlueY  = -(1/3) * 0.453 = -0.151
#
# Horizontal: red and blue are NOT coincident, they sit either side of green,
# so the split is a straight half-separation plus a third of the small
# residual GreenX offset (the same zero-mean algebra, done for two outer
# channels and one near-centre one instead of one outer pair):
#
#   RedX  =  0.455/2 - 0.019/3 =  0.221
#   BlueX = -0.455/2 - 0.019/3 = -0.234
#   GreenX =        2*0.019/3 =  0.013
#
# Zero-mean in both axes by construction (0.221 + 0.013 - 0.234 = 0.000,
# -0.151 + 0.302 - 0.151 = 0.000), so the shader's centring step is a no-op
# on this preset, same as osorio-sdf and shipped-defaults.
#
# Sharpen stays 0.0 for the reason osorio-sdf gives: the panel's own optical
# diffusion is doing real work here, and sharpening after this shift would
# fight the low-pass that made osorio-sdf's own hardware-tuned reading
# correct, not recover detail lost to the resample.
#
# [Effect-fringeshift]
# RedX=0.221
# RedY=-0.151
# GreenX=0.013
# GreenY=0.302
# BlueX=-0.234
# BlueY=-0.151
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# -------------------------------------------------------------------------
# ultracode-claude -- gen3-consensus deliberately overshot against the
# shader's own measured displacement-gain rolloff
# -------------------------------------------------------------------------
# Every preset above writes in a physically-measured (or physically-derived)
# emitter offset and trusts the resample to deliver it. None of them account
# for the one thing this codebase's own measurement harness has already
# found: displacement gain is NOT 1, and it is NOT constant. For the shipped
# default's centred 0.225 px fraction, tests/measure.cpp measures 0.982 of
# nominal at f = 1/16 cyc/px but only 0.733 at f = 0.25 -- close to the
# spatial frequency of a fine text stroke, i.e. exactly the content this
# effect exists to correct, and exactly where the fringe is most visible.
# Every preset above quietly eats that ~27% shortfall at the frequencies
# that matter most, in exchange for landing correctly on flat colour, where
# there was barely any fringe to see in the first place.
#
# This preset takes the opposite bet: dial in MORE than the measured
# geometry, so the correction that actually survives the resample at
# high spatial frequency lands closer to the true separation, and accept
# the resulting overshoot on low-frequency content as the price.
#
# STARTING POINT: gen3-consensus, the best available physical reading
# (mean of three independent measurements -- scale drawing, macro
# photograph, hardware-tuned renderer):
#
#   RedX=0.221  RedY=-0.151  GreenX=0.013  GreenY=0.302
#   BlueX=-0.234  BlueY=-0.151
#
# SCALE FACTOR
#
# The full inverse of the worst measured shortfall is 1/0.733 = 1.365 --
# treat that as an upper anchor, not a target. Only two points on the
# gain-vs-frequency curve are measured, at one fraction (~0.225 px); using
# their exact ratio as a closed-form correction manufactures precision the
# data does not support, and gain itself rises with the fraction (the
# quadratic Laplacian compensation term partly offsets the interpolator's
# phase lag as fraction grows), so a naive full inversion would overshoot
# once the larger fraction it produces is itself rendered.
#
# Landing at 1.25 -- short of the 1.365 ceiling, with margin -- delivers:
#
#   high frequency (f=0.25):  1.25 x 0.733 = 0.916  ->  92% of true separation
#                             (up from 73% delivered by gen3-consensus itself)
#   low frequency  (f=1/16):  1.25 x 0.982 = 1.228   ->  23% overshoot
#                             (in flat regions where the fringe was faint
#                              even at the correct, un-overshot geometry)
#
# 1.25, not further, because gen3-consensus's own largest component
# (GreenY=0.302) already sits at the ~0.225 px fraction the gain anchors
# were measured at; scaling past that pushes the actually-rendered fraction
# past the regime those two anchors characterise at all, and a first test
# of this hypothesis should keep margin rather than claim the ceiling.
#
# SCALED, PER CHANNEL (gen3-consensus x 1.25, same zero-mean geometry)
#
#   RedX   =  0.221 * 1.25 =  0.276     RedY   = -0.151 * 1.25 = -0.189
#   GreenX =  0.013 * 1.25 =  0.016     GreenY =  0.302 * 1.25 =  0.378
#   BlueX  = -0.234 * 1.25 = -0.293     BlueY  = -0.151 * 1.25 = -0.189
#
# A uniform scalar multiple of a zero-sum vector is still zero-sum
# (0.276 + 0.016 - 0.293 = -0.001, rounding; -0.189 + 0.378 - 0.189 = 0.000
# exactly), so the shader's own min/max centring step remains a no-op here,
# same as on gen3-consensus itself. Every scaled component (max |0.378|,
# GreenY) stays far inside the +/-1.0 clamp, and at that fraction the
# per-axis compensation term ca * f^2 (bicubic, ca=0.8625) is only ~0.123 --
# comfortably under the 0.35 overshoot/ringing cap the shader's own author
# chose for that term alone. Sharpen stays 0.0, Bicubic and Adaptive stay
# on: this preset spends its risk on ONE lever, geometry, so a visible
# regression is traceable to a single, named cause rather than two
# confounded ones.
#
# WHERE THIS CAN GO WRONG
#
# The 0.982 / 0.733 anchors were measured at ~0.225 px on a y-varying 1D
# grating; per the harness's own documented blind spot (see "Testing" in
# CLAUDE.md) the measurement says nothing directly about the x axis, and
# this preset's largest components include two sizeable x shifts (RedX
# 0.276, BlueX -0.293) plus a GreenY (0.378) that overshoots the anchor
# fraction itself. Whether gain keeps rising smoothly out to 0.378 px,
# flattens, or reverses is unmeasured -- 1.25 is a bounded bet on a
# two-point curve, not a verified extrapolation. And the low-frequency
# overshoot is not a corner case: any large flat region, thick glyph stroke,
# or window-chrome edge gets ~23% more channel separation than the true
# physical geometry, permanently, because the geometric shift is never
# gated by content the way Sharpen is. This preset is a deliberate trade of
# a small, constant, always-present overcorrection for a large reduction in
# an intermittent, content-dependent undercorrection -- worth taking only if
# fine-text legibility outweighs flat-region colour fringing, which is the
# premise this whole effect is built on, but is not automatically true for
# every user or every panel.
#
# [Effect-fringeshift]
# RedX=0.276
# RedY=-0.189
# GreenX=0.016
# GreenY=0.378
# BlueX=-0.293
# BlueY=-0.189
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


# =========================================================================
# MYTHOLOGY PRESETS -- browsed and eliminated with `fringe-presets`
# =========================================================================
# Twenty-two parameter sets, each named for a figure tied to eyes, sight or
# vision, explored with the `fringe-presets` script's checkbox-and-narrow
# picker (space to check, enter to keep only what's checked -- or, with
# nothing checked, just the highlighted one -- and start a new round).
#
# Two are not new geometry at all, just a mythological label on an existing
# reading from earlier in this file: chenrezig IS gen3-layout-mpe (the
# averaged ~60-cell macro-photo lattice -- "a thousand eyes averaged into
# one"), and bastet IS gen3-layout-spe (the single-cell scale-drawing read --
# "keen feline focus on a single cell"). A third, horus, was gen3-consensus's
# sibling osorio-sdf under a new name and did not survive the first round.
#
# The rest are NOT measurements. They are synthetic variations on the same
# six numbers -- axis-only, asymmetric, soft/bilinear resample, near the
# +/-1 px clamp -- picked to cover the shape of the parameter space for a
# by-eye elimination pass, not to model a panel. Every one carries
# Sharpen=0.0: this batch is geometry only, so a preset that looks better is
# a claim about the shift, not about the unsharp term riding on top of it.
#
# Bicubic is true and Adaptive is true throughout except tiresias and
# pythia, which set Bicubic=false to test the same geometry under the softer
# bilinear resample instead of Catmull-Rom.
#
# WHAT fringe-presets SHIPS TODAY
# -------------------------------------------------------------------------
# The first round's five survivors, plus argus, re-added afterwards:
# argus, mimir, cassandra, chenrezig, bastet, medusa. The other sixteen
