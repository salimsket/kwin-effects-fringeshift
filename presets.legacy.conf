# -------------------------------------------------------------------------
# balor -- the evil eye that kills with a glance
# -------------------------------------------------------------------------
# The most extreme preset in this file: GreenY 0.600 is 60% of the way to
# the +/-1 px clamp readConfig() enforces, and every axis is scaled up to
# match. For testing the far end of the range, not for daily use -- see the
# README's note on shift-gain before assuming this magnitude survives the
# resample at anything close to face value. Did not survive the first round
# (unsurprisingly).
#
# [Effect-fringeshift]
# RedX=0.450
# RedY=-0.300
# GreenX=0.000
# GreenY=0.600
# BlueX=-0.450
# BlueY=-0.300
# Bicubic=true
# Adaptive=true
# Sharpen=0.0
# ShowMask=false


